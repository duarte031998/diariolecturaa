<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d77f98">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Mi Diario de Lectura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: una estantería de portadas rosadas; al abrir un libro, una página de diario con frases subrayadas y reseña. */
:root{
  --bg:#fbeff2; --paper:#fffafb; --blush:#f6d9e1; --rose:#d77f98; --deep:#9b4562; --ink:#4b2b35; --muted:#8f6b77; --line:#ecc9d3;
  --hl:rgba(244,160,186,.45);
  --script:"Pinyon Script","Great Vibes",cursive;
  --serif:"Cormorant Garamond","Cormorant",Georgia,serif;
  --ui:"Nunito",ui-rounded,system-ui,sans-serif;
  --shadow:0 10px 30px -14px rgba(155,69,98,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#23151a; --paper:#2d1c23; --blush:#43262f; --rose:#e79ab0; --deep:#f3b7c8; --ink:#f7e6ec; --muted:#c79eab; --line:#4f2f3a;
  --hl:rgba(231,154,176,.28); --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#23151a; --paper:#2d1c23; --blush:#43262f; --rose:#e79ab0; --deep:#f3b7c8; --ink:#f7e6ec; --muted:#c79eab; --line:#4f2f3a;
  --hl:rgba(231,154,176,.28); --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 8%,var(--blush) 0,transparent 32%),radial-gradient(circle at 92% 30%,var(--blush) 0,transparent 26%);
  background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--script);font-weight:400;font-size:clamp(46px,8vw,74px);line-height:1;margin:0;color:var(--deep)}
.sub{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:4px 0 0}
.stats{display:flex;gap:18px;font-family:var(--serif);color:var(--muted);font-size:16px}
.stats b{display:block;font-family:var(--serif);font-size:30px;color:var(--deep);line-height:1;font-weight:600;font-variant-numeric:tabular-nums}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:6px 14px;border-radius:999px;font:600 13px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px;font:15px var(--ui)}
.btn{border:0;border-radius:999px;padding:9px 18px;font:700 14px var(--ui);cursor:pointer;background:var(--deep);color:var(--paper)}
.btn.soft{background:var(--blush);color:var(--deep)}
.btn.ghost{background:transparent;color:var(--muted);padding:6px 10px}
.btn.danger{background:#c2415d;color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

.note{font-size:13px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:8px 14px;margin-bottom:16px}

/* estantería */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.book{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:4px 12px 12px 4px;padding:18px 14px 14px 22px;display:flex;flex-direction:column;justify-content:space-between;
  color:#fff;box-shadow:var(--shadow);overflow:hidden;transition:transform .25s ease}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:rgba(0,0,0,.14)}
.cover::after{content:"";position:absolute;inset:10px 10px 10px 18px;border:1px solid rgba(255,255,255,.45);border-radius:2px 8px 8px 2px;pointer-events:none}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-6px) rotate(-1deg)}
.book:focus-visible{outline:2px solid var(--rose);outline-offset:4px;border-radius:10px}
.cover .ct{font-family:var(--script);font-size:27px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.cover .ca{font-family:var(--serif);font-style:italic;font-size:15px;opacity:.95}
.badge{position:absolute;top:8px;right:8px;z-index:1;font:700 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.88);color:#9b4562;border-radius:999px;padding:3px 8px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);gap:6px}
.stars{color:var(--rose);letter-spacing:1px;font-size:14px}
.state{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

.empty{grid-column:1/-1;text-align:center;padding:50px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:20px}
.empty h3{font-family:var(--script);font-weight:400;font-size:40px;color:var(--deep);margin:0 0 6px}
.empty p{font-family:var(--serif);font-size:18px;color:var(--muted);margin:0 auto 16px;max-width:42ch}

/* panel de libro */
.overlay{position:fixed;inset:0;background:rgba(75,43,53,.38);backdrop-filter:blur(3px);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);width:100%;max-width:760px;border-radius:24px;box-shadow:0 30px 60px -20px rgba(75,43,53,.45);overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);background-position:0 18px}
.sheet-head{display:flex;gap:20px;padding:26px 26px 10px;flex-wrap:wrap;background:var(--paper)}
.sheet-head .cover{width:118px;flex:none;padding:12px 10px 10px 16px}
.sheet-head .cover .ct{font-size:20px}
.sheet-head .info{flex:1 1 260px;min-width:0}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1;margin:0;text-wrap:balance}
.sheet .author{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:2px 0 10px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.facts strong{color:var(--ink);font-weight:700}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.close{position:absolute;right:14px;top:12px}
.sec{padding:14px 26px 22px}
.sec h3{font-family:var(--script);font-weight:400;font-size:36px;color:var(--deep);margin:0 0 6px;line-height:1.2}
.quote{position:relative;margin:0 0 14px;padding:4px 34px 4px 0}
.quote p{margin:0;font-family:var(--serif);font-size:21px;line-height:1.5;font-style:italic}
.quote p mark{background:linear-gradient(transparent 38%,var(--hl) 38%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.quote .pg{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.quote .x{position:absolute;right:0;top:4px}
.addq{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-top:6px}
@media (max-width:520px){.addq{grid-template-columns:1fr 1fr}.addq textarea{grid-column:1/-1}}
.review{font-family:var(--serif);font-size:20px;line-height:1.7;white-space:pre-wrap;margin:0}
.muted{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:18px}

/* formularios */
.form{padding:26px;display:grid;gap:14px;background:var(--paper)}
.form h2{font-family:var(--script);font-weight:400;font-size:44px;color:var(--deep)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:16px var(--ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
textarea{font-family:var(--serif);font-size:18px;resize:vertical;min-height:80px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-checked="true"]{border-color:var(--ink)}
.rate{display:flex;gap:2px}
.rate button{all:unset;cursor:pointer;font-size:26px;color:var(--line);line-height:1}
.rate button.on{color:var(--rose)}
.rate button:focus-visible{outline:2px solid var(--rose);border-radius:4px}
.formfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.confirm{background:var(--blush);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 26px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Mi diario de lectura</h1>
      <p class="sub">Libros, frases subrayadas y lo que me dejaron</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div id="note" class="note" hidden></div>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
    <input id="q" class="search" type="search" placeholder="Buscar título, autor o frase…" aria-label="Buscar">
    <button id="addBtn" class="btn">+ Añadir libro</button>
    <button id="expBtn" class="btn soft" hidden>Guardar copia</button>
    <button id="impBtn" class="btn soft" hidden>Restaurar copia</button>
    <input id="impFile" type="file" accept="application/json,.json" hidden>
  </div>

  <main class="shelf" id="shelf"></main>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const COLORS=["#d77f98","#e8a1b3","#b85c7a","#c98fa8","#e3a28c","#a97b9f","#8f4a63","#d9a3a8"];
const STATES={leyendo:"Leyendo",leido:"Leído",porleer:"Por leer"};
let books=[], filter="todos", query="", canWrite=false, col=null, mode="loading", openId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars=n=>"♥".repeat(n||0)+"♡".repeat(5-(n||0));
const fmt=d=>{if(!d)return"";try{return new Date(d+"T12:00").toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function note(t){const n=$("#note");n.textContent=t||"";n.hidden=!t}

/* ---------- almacenamiento ---------- */
const LS="diario-lectura-local";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(books))}catch(e){}}
async function saveBook(b){
  const data={...b};delete data.id;data.actualizado=Date.now();
  if(mode==="db"){await col.doc(b.id).set(data)}
  else{const i=books.findIndex(x=>x.id===b.id);if(i>=0)books[i]={...b,...data};else books.push({...b,...data});lsSave();render()}
}
async function removeBook(id){
  if(mode==="db"){await col.doc(id).delete()}
  else{books=books.filter(b=>b.id!==id);lsSave();render()}
}
const newId=()=>"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function init(){
  render();
  const timer=setTimeout(()=>{if(mode==="loading")note("Tu diario tarda en cargar. Revisa tu conexión.")},10000);
  const db=await window.claude?.use?.("db").catch(()=>null);
  if(!db){clearTimeout(timer);mode="local";canWrite=true;books=lsLoad();
    note("Tus libros se guardan en este Mac. Usa «Guardar copia» de vez en cuando para tener un respaldo.");render();
    try{if(navigator.storage&&navigator.storage.persist){const ok=(await navigator.storage.persisted())||(await navigator.storage.persist());
      if(ok)note("Tus libros quedan guardados en este Mac. Usa «Guardar copia» de vez en cuando para tener un respaldo.")}}catch(e){}
    return}
  const user=await window.claude.use("user").catch(()=>null);
  canWrite=user?(user.isOwner()):false;
  col=db.collection("libros");
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);note(canWrite?"":"Estás viendo este diario en modo lectura.")}
    mode="db";books=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    if(openId){const b=books.find(x=>x.id===openId);if(b&&!$("#overlay").hidden&&$("#overlay").dataset.view==="detail")openDetail(openId,true)}
  },e=>{clearTimeout(timer);note("No se pudo cargar el diario ("+e.code+"). Recarga la página más tarde.")});
}

/* ---------- estantería ---------- */
function render(){
  $("#addBtn").hidden=!canWrite;$("#expBtn").hidden=$("#impBtn").hidden=mode!=="local";
  const counts={todos:books.length};for(const k in STATES)counts[k]=books.filter(b=>b.estado===k).length;
  $("#chips").innerHTML=[["todos","Todos"],...Object.entries(STATES)].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l} · ${counts[k]}</button>`).join("");
  const nq=books.reduce((a,b)=>a+(b.frases?.length||0),0);
  $("#stats").innerHTML=`<div><b>${counts.leido}</b>leídos</div><div><b>${counts.leyendo}</b>leyendo</div><div><b>${nq}</b>frases</div>`;
  const q=query.trim().toLowerCase();
  let list=books.filter(b=>(filter==="todos"||b.estado===filter)&&(!q||[b.titulo,b.autor,b.resena,...(b.frases||[]).map(f=>f.texto)].join(" ").toLowerCase().includes(q)));
  const order={leyendo:0,leido:1,porleer:2};
  list.sort((a,b)=>(order[a.estado]??3)-(order[b.estado]??3)||(b.creado||0)-(a.creado||0));
  const shelf=$("#shelf");
  if(mode==="loading"){shelf.innerHTML=`<div class="empty"><h3>Abriendo tu diario…</h3><p>Tus libros, frases y reseñas aparecerán aquí en un momento.</p></div>`;return}
  if(!books.length){shelf.innerHTML=`<div class="empty"><h3>Tu estantería está vacía</h3><p>Añade el libro que estás leyendo, guarda las frases que subrayaste y escribe lo que te hizo sentir.</p>${canWrite?'<button class="btn" data-act="add">+ Añadir mi primer libro</button>':""}</div>`;return}
  if(!list.length){shelf.innerHTML=`<div class="empty"><h3>Nada por aquí</h3><p>Ningún libro coincide con tu búsqueda.</p></div>`;return}
  shelf.innerHTML=list.map(b=>`<button class="book" data-id="${esc(b.id)}" aria-label="${esc(b.titulo)}">
    <div class="cover" style="background:linear-gradient(160deg,${esc(b.color||COLORS[0])},color-mix(in srgb,${esc(b.color||COLORS[0])} 70%,#5a2238))">
      ${b.ejemplo?'<span class="badge">Ejemplo</span>':""}
      <span class="ct">${esc(b.titulo)}</span><span class="ca">${esc(b.autor)}</span></div>
    <div class="meta"><span class="state">${STATES[b.estado]||""}</span><span class="stars">${b.valoracion?stars(b.valoracion):""}</span></div>
    <div class="meta"><span>${(b.frases||[]).length} frase${(b.frases||[]).length===1?"":"s"}</span><span>${b.fin?fmt(b.fin):b.inicio?"desde "+fmt(b.inicio):""}</span></div>
  </button>`).join("");
}
function coverHTML(b){return `<div class="cover" style="background:linear-gradient(160deg,${esc(b.color||COLORS[0])},color-mix(in srgb,${esc(b.color||COLORS[0])} 70%,#5a2238))"><span class="ct">${esc(b.titulo)}</span><span class="ca">${esc(b.autor)}</span></div>`}

/* ---------- detalle ---------- */
function openOverlay(html,view){const o=$("#overlay");o.innerHTML=html;o.dataset.view=view;o.hidden=false;document.body.style.overflow="hidden"}
function closeOverlay(){const o=$("#overlay");o.hidden=true;o.innerHTML="";openId=null;document.body.style.overflow=""}
function openDetail(id,keepScroll){
  const b=books.find(x=>x.id===id);if(!b)return closeOverlay();openId=id;
  const o=$("#overlay"),st=o.scrollTop,draft=$("#qText")?.value||"",draftP=$("#qPage")?.value||"";
  const fr=b.frases||[];
  openOverlay(`<article class="sheet" role="dialog" aria-modal="true" aria-label="${esc(b.titulo)}" style="position:relative">
    <button class="btn ghost close" data-act="close" aria-label="Cerrar">✕</button>
    <div class="sheet-head">${coverHTML(b)}
      <div class="info"><h2>${esc(b.titulo)}</h2><p class="author">${esc(b.autor)}</p>
        <div class="facts"><span><strong>${STATES[b.estado]||"—"}</strong></span>
          ${b.valoracion?`<span class="stars">${stars(b.valoracion)}</span>`:""}
          ${b.inicio?`<span>Empecé: <strong>${fmt(b.inicio)}</strong></span>`:""}
          ${b.fin?`<span>Terminé: <strong>${fmt(b.fin)}</strong></span>`:""}
          ${b.paginas?`<span><strong>${esc(b.paginas)}</strong> págs.</span>`:""}</div>
        ${canWrite?`<div class="actions"><button class="btn soft" data-act="edit">Editar</button><button class="btn ghost" data-act="askdel">Eliminar</button></div>`:""}
      </div></div>
    <div id="confirmSlot"></div>
    <section class="sec"><h3>Frases resaltadas</h3>
      ${fr.length?fr.map((f,i)=>`<figure class="quote"><p><mark>${esc(f.texto)}</mark></p>${f.pagina?`<span class="pg">pág. ${esc(f.pagina)}</span>`:""}${canWrite?`<button class="btn ghost x" data-act="delq" data-i="${i}" aria-label="Quitar frase">✕</button>`:""}</figure>`).join(""):`<p class="muted">Aún no has guardado frases de este libro.</p>`}
      ${canWrite?`<div class="addq"><textarea id="qText" rows="2" placeholder="Escribe la frase que subrayaste…"></textarea><input id="qPage" placeholder="Página" inputmode="numeric"><button class="btn" data-act="addq">Guardar frase</button></div>`:""}
    </section>
    <section class="sec"><h3>Mi reseña</h3>
      ${b.resena?`<p class="review">${esc(b.resena)}</p>`:`<p class="muted">Todavía no escribes tu reseña.${canWrite?" Pulsa «Editar» para añadirla.":""}</p>`}
    </section></article>`,"detail");
  if(keepScroll){o.scrollTop=st;if($("#qText")){$("#qText").value=draft;$("#qPage").value=draftP}}
}

/* ---------- formulario ---------- */
function openForm(id){
  const b=id?books.find(x=>x.id===id):{titulo:"",autor:"",estado:"leyendo",valoracion:0,color:COLORS[Math.floor(Math.random()*COLORS.length)],inicio:new Date().toISOString().slice(0,10),fin:"",paginas:"",resena:"",frases:[]};
  openId=id||null;
  openOverlay(`<form class="sheet form" id="bookForm" role="dialog" aria-modal="true" aria-label="Libro">
    <h2>${id?"Editar libro":"Nuevo libro"}</h2>
    <label>Título<input id="fTitulo" required maxlength="140" value="${esc(b.titulo)}"></label>
    <label>Autor/a<input id="fAutor" maxlength="120" value="${esc(b.autor)}"></label>
    <div class="row">
      <label>Estado<select id="fEstado">${Object.entries(STATES).map(([k,l])=>`<option value="${k}" ${b.estado===k?"selected":""}>${l}</option>`).join("")}</select></label>
      <label>Páginas<input id="fPaginas" inputmode="numeric" value="${esc(b.paginas)}"></label>
    </div>
    <div class="row">
      <label>Empecé<input id="fInicio" type="date" value="${esc(b.inicio)}"></label>
      <label>Terminé<input id="fFin" type="date" value="${esc(b.fin)}"></label>
    </div>
    <div class="row">
      <div><label>Valoración</label><div class="rate" id="fRate" data-v="${b.valoracion||0}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} de 5" class="${n<=(b.valoracion||0)?"on":""}">♥</button>`).join("")}</div></div>
      <div><label>Color de portada</label><div class="swatches" id="fColor" role="radiogroup" data-v="${esc(b.color)}">${COLORS.map(c=>`<button type="button" class="sw" role="radio" aria-label="Color ${c}" aria-checked="${c===b.color}" data-c="${c}" style="background:${c}"></button>`).join("")}</div></div>
    </div>
    <label>Mi reseña<textarea id="fResena" rows="6" placeholder="¿Qué te dejó este libro? ¿Qué te gustó, qué no, a quién se lo recomendarías?">${esc(b.resena)}</textarea></label>
    <div class="formfoot"><button type="button" class="btn ghost" data-act="${id?"back":"close"}">Cancelar</button><button class="btn" type="submit">Guardar</button></div>
  </form>`,"form");
  $("#fTitulo").focus();
  $("#bookForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const nb={...b,id:id||newId(),titulo:$("#fTitulo").value.trim(),autor:$("#fAutor").value.trim(),estado:$("#fEstado").value,paginas:$("#fPaginas").value.trim(),
      inicio:$("#fInicio").value,fin:$("#fFin").value,valoracion:+$("#fRate").dataset.v||0,color:$("#fColor").dataset.v,resena:$("#fResena").value.trim(),frases:b.frases||[],creado:b.creado||Date.now()};
    delete nb.ejemplo;
    if(!nb.titulo)return;
    try{await saveBook(nb);toast(id?"Libro actualizado":"Libro añadido");openDetail(nb.id)}catch(err){toast("No se pudo guardar. Inténtalo de nuevo.")}
  });
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-f],.book,.rate button,.sw");if(!t)return;
  if(t.matches("[data-f]")){filter=t.dataset.f;render();return}
  if(t.matches(".book")){openDetail(t.dataset.id);return}
  if(t.matches(".rate button")){const r=$("#fRate"),n=+t.dataset.n,v=+r.dataset.v===n?0:n;r.dataset.v=v;r.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=v));return}
  if(t.matches(".sw")){const g=$("#fColor");g.dataset.v=t.dataset.c;g.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-checked",x===t));return}
  const a=t.dataset.act,b=books.find(x=>x.id===openId);
  if(a==="close")closeOverlay();
  else if(a==="add")openForm();
  else if(a==="edit")openForm(openId);
  else if(a==="back")openDetail(openId);
  else if(a==="askdel")$("#confirmSlot").innerHTML=`<div class="confirm"><span>¿Eliminar «${esc(b.titulo)}» con sus frases y reseña? No se puede deshacer.</span><span style="display:flex;gap:6px"><button class="btn ghost" data-act="nodel">Cancelar</button><button class="btn danger" data-act="del">Eliminar</button></span></div>`;
  else if(a==="nodel")$("#confirmSlot").innerHTML="";
  else if(a==="del"){try{await removeBook(openId);closeOverlay();toast("Libro eliminado")}catch(err){toast("No se pudo eliminar.")}}
  else if(a==="addq"){const txt=$("#qText").value.trim();if(!txt)return;const nb={...b,frases:[...(b.frases||[]),{texto:txt,pagina:$("#qPage").value.trim()}]};
    $("#qText").value="";$("#qPage").value="";try{await saveBook(nb);toast("Frase guardada");if(mode!=="db")openDetail(openId,true)}catch(err){toast("No se pudo guardar la frase.")}}
  else if(a==="delq"){const fr=[...(b.frases||[])];fr.splice(+t.dataset.i,1);try{await saveBook({...b,frases:fr});if(mode!=="db")openDetail(openId,true)}catch(err){toast("No se pudo quitar la frase.")}}
});
$("#addBtn").addEventListener("click",()=>openForm());
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeOverlay()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden)closeOverlay()});
$("#expBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({app:"diario-lectura",version:1,libros:books},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="diario-lectura-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Copia guardada");
});
$("#impBtn").addEventListener("click",()=>$("#impFile").click());
$("#impFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());const list=Array.isArray(d)?d:d.libros;if(!Array.isArray(list))throw 0;
    const byId=new Map(books.map(b=>[b.id,b]));list.forEach(b=>{if(b&&b.id&&b.titulo)byId.set(b.id,b)});
    books=[...byId.values()];lsSave();render();toast(list.length+" libros restaurados")}
  catch(err){toast("Ese archivo no es una copia del diario.")}
  e.target.value="";
});
init();
</script>

</body>
</html>
